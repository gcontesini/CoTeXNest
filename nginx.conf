# Serves the static frontend and reverse-proxies the API to the
# "backend" container, so the browser only ever talks to one origin
# (this one) and `src/webapp/static/js/api.js`'s relative `/api/...`
# paths keep working unchanged, regardless of whether the app is
# running as a single process (`just dev`) or split across two
# containers (`just up` / `docker compose up`).

server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # LaTeX compilation can take up to WEBAPP_COMPILE_TIMEOUT (60s by
  # default) on the backend; give the proxy comfortable headroom so
  # nginx never times out a compile that the backend would have
  # finished.
  proxy_read_timeout 90s;
  proxy_send_timeout 90s;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /healthz {
    proxy_pass http://backend:8000/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
