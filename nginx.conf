# Serves the static frontend and reverse-proxies the API to the
# "backend" container, so the browser only ever talks to one origin
# (this one) and `src/webapp/static/js/api.js`'s relative `/api/...`
# paths keep working unchanged, regardless of whether the app is
# running as a single process (`just dev`) or split across two
# containers (`just up` / `docker compose up`).

server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # LaTeX compilation can take up to WEBAPP_COMPILE_TIMEOUT (60s by
  # default) on the backend. The AI assistant's local provider can take
  # much longer than that on a cold start: the first chat/suggest/fix
  # request against a given Ollama model triggers a blocking pull of
  # that model (minutes, for a multi-gigabyte model) before it can
  # answer at all. Both need comfortable headroom so nginx never times
  # out a request the backend would have finished.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /healthz {
    proxy_pass http://backend:8000/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
