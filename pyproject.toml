[project]
name = "webapp"
version = "0.1.0"
description = "Self-hosted, Docker-deployed LaTeX editor: web editor, PDF preview, git-backed version history, and a LaTeX package/template manager."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "gitpython",
  "python-multipart",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "sphinx",
  "myst-parser",
  "furo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webapp"]
